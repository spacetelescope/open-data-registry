Name: SDSS DR7 Spectra
Description: |
  The Sloan Digital Sky Survey (SDSS) Data Release 7 (DR7) provides imaging over 11,663 deg^2, with five-band photometry for 357 million objects. 
  It includes regions in the Northern and Southern Galactic Caps, as well as areas at low Galactic latitude. 
  The survey has completed spectroscopy over 9,380 deg^2, collecting over 1.6 million spectra in total from galaxies, quasars, and stars.
Contact: archive@stsci.edu
Documentation: https://archive.stsci.edu/missions-and-data/sdss
ManagedBy: "[Space Telescope Science Institute](http://www.stsci.edu/)"
Citation: If using this data in published research, visit the [SDSS Credits page](https://classic.sdss.org/collaboration/credits.php) for the appropriate citation.
